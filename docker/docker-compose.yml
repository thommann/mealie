services:
  mealie:
    container_name: mealie
    image: mealie:dev
    build:
      context: ../
      target: production
      dockerfile: ./docker/Dockerfile
    restart: always
    depends_on:
      - litellm
    volumes:
      - mealie-data:/app/data/
    ports:
      - 9091:9000
    environment:
      ALLOW_SIGNUP: "false"
      LOG_LEVEL: "DEBUG"

      LLM_BASE_URL: "http://litellm:4000"
      LLM_API_KEY: "${LITELLM_MASTER_KEY}"

      DB_ENGINE: sqlite # Optional: 'sqlite', 'postgres'
      # =====================================
      # Postgres Config
      POSTGRES_USER: mealie
      POSTGRES_PASSWORD: mealie
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: mealie
      # =====================================
      # Email Configuration
      # SMTP_HOST=
      # SMTP_PORT=587
      # SMTP_FROM_NAME=Mealie
      # SMTP_AUTH_STRATEGY=TLS # Options: 'TLS', 'SSL', 'NONE'
      # SMTP_FROM_EMAIL=
      # SMTP_USER=
      # SMTP_PASSWORD=

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: mealie-litellm
    ports:
      - "4000:4000"          # bind to localhost in production
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    env_file:
      - .env
    environment:
      # LiteLLM authenticates inbound requests using LITELLM_MASTER_KEY.
      # We expose the same secret to the application as LLM_API_KEY (see
      # mealie service above) so the app stays gateway-agnostic.
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY}"
    restart: unless-stopped

volumes:
  mealie-data:
    driver: local
