name: Architecture
on: [push, pull_request]
jobs:
  import-linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libsasl2-dev libldap2-dev libssl-dev
      - run: uv sync --extra pgsql --group dev
      - run: uv run lint-imports

  likec4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - run: cd docs/architecture && npm ci && npx likec4 build
